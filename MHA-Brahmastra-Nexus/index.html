<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORAX GLOBAL OS — Nexus Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nx-header">
  <div class="nx-header__inner">
    <div class="nx-logo">
      <!-- LOGO PLACEHOLDER: <img src="logo.png" alt="Nexorax" class="nx-logo__img"> will replace the text mark below -->
      <span class="nx-logo__text">NEXORAX <span class="nx-logo__accent">GLOBAL OS</span></span>
    </div>
    <nav class="nx-header__meta">
      <span class="nx-status">
        <span class="nx-status__dot"></span>
        SYSTEMS NOMINAL
      </span>
      <span class="nx-header__count" id="module-count">41 MODULES</span>
    </nav>
  </div>
</header>

<main class="nx-main">
  <section class="nx-intro">
    <h1 class="nx-intro__title">Your workspace, in one place</h1>
    <p class="nx-intro__sub">Every module lives here. Pick one up where you left off.</p>
  </section>

  <section id="nexus-grid" class="nexus-grid" aria-label="Productivity modules">
    <!-- Cards are injected here by js/main.js -->
  </section>
</main>

<footer class="nx-footer">
  <p>NEXORAX GLOBAL OS — local session state only.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
