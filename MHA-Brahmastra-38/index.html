<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vocal Echo Protocol</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============================= -->
  <!-- STATE 1: SETUP SCREEN         -->
  <!-- ============================= -->
  <section id="setup-screen" class="screen active">
    <div class="setup-card">
      <p class="eyebrow">Hands-Free Focus Check</p>
      <h1 class="app-title">Vocal Echo Protocol</h1>
      <p class="app-subtitle">Say the word out loud when you're checked on. Stay sharp.</p>

      <div class="config-group">
        <label for="language-select">Language</label>
        <select id="language-select">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
        </select>
      </div>

      <div class="config-group">
        <label for="interval-select">Check Interval</label>
        <select id="interval-select">
          <option value="5">5 Minutes</option>
          <option value="10">10 Minutes</option>
          <option value="15">15 Minutes</option>
          <option value="20">20 Minutes</option>
          <option value="25">25 Minutes</option>
          <option value="30" selected>30 Minutes</option>
        </select>
      </div>

      <div class="config-group">
        <label for="response-select">Response Time</label>
        <select id="response-select">
          <option value="5">5 Seconds</option>
          <option value="10">10 Seconds</option>
          <option value="15" selected>15 Seconds</option>
          <option value="20">20 Seconds</option>
          <option value="25">25 Seconds</option>
        </select>
      </div>

      <button id="start-btn" class="start-button">START SESSION</button>
      <p id="setup-error" class="setup-error"></p>
    </div>
  </section>

  <!-- ============================= -->
  <!-- STATE 2: STANDBY / ALERT      -->
  <!-- ============================= -->
  <section id="standby-screen" class="screen">
    <div class="standby-inner">
      <div id="mic-icon" class="mic-icon">
        <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </div>
      <p id="standby-status" class="standby-status">LISTENING FOR SILENCE...</p>
      <p id="countdown-display" class="countdown-display"></p>
      <button id="stop-btn" class="stop-button">END SESSION</button>
    </div>
  </section>

  <!-- ============================= -->
  <!-- STATE 3: DEFEAT               -->
  <!-- ============================= -->
  <section id="defeat-screen" class="screen">
    <div class="defeat-inner">
      <h2 class="defeat-title">CHECK FAILED</h2>
      <p class="defeat-line">Expected word: <span id="expected-word" class="defeat-word">—</span></p>
      <p class="defeat-line">Heard: <span id="heard-transcript" class="defeat-heard">—</span></p>
      <button id="restart-btn" class="restart-button">RESTART SESSION</button>
    </div>
  </section>

</div>

<script src="js/main.js"></script>
</body>
</html>
