<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Genesis Gate — secure futuristic authentication interface." />
  <title>Genesis Gate — Authentication</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app-shell">
    <!-- Ambient visual layer -->
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <section class="auth-card" aria-labelledby="page-title">
      <div class="status-line">
        <span class="status-dot" aria-hidden="true"></span>
        <span>SECURE ACCESS</span>
        <span class="status-code">GG-01</span>
      </div>

      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <p class="eyebrow">NEXORA X / IDENTITY</p>
        <h1 id="page-title">Genesis Gate</h1>
        <p class="subtitle">
          Enter your secure workspace.
        </p>
      </header>

      <form id="authForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="email">Email address</label>

          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6.5h16v11H4z"></path>
              <path d="m4 7 8 6 8-6"></path>
            </svg>

            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="you@example.com"
              maxlength="254"
              required
            />
          </div>

          <small class="error-message" id="emailError"></small>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="password">Password</label>
            <button
              type="button"
              class="text-button"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>

          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              maxlength="128"
              required
            />
          </div>

          <small class="error-message" id="passwordError"></small>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember" />
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>

          <button type="button" class="text-button" id="forgotPassword">
            Forgot password?
          </button>
        </div>

        <button class="primary-button" id="loginButton" type="submit">
          <span class="button-text">Enter Genesis Gate</span>
          <span class="button-loader" aria-hidden="true"></span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="divider">
        <span></span>
        <small>OR</small>
        <span></span>
      </div>

      <button class="secondary-button" id="guestButton" type="button">
        Continue as guest
      </button>

      <footer class="card-footer">
        <p>
          New here?
          <button type="button" class="signup-button" id="signupButton">
            Create account
          </button>
        </p>

        <div class="security-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5 6v5c0 4.6 2.9 8.2 7 10 4.1-1.8 7-5.4 7-10V6l-7-3Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          <span>Protected session interface</span>
        </div>
      </footer>
    </section>

    <!-- Accessible status announcements -->
    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
